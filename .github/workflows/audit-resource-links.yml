name: Audit and normalize resource links

on:
  push:
    paths:
      - 'scripts/audit-links.mjs'
      - '.github/workflows/audit-resource-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Audit and normalize links
        id: audit
        continue-on-error: true
        run: node scripts/audit-links.mjs

      - name: Show audit report
        if: always()
        run: cat link-audit-report.json

      - name: Commit normalized link fixes
        if: always()
        run: |
          rm -f link-audit-report.json
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/resources.ts app/motionResources.ts app/uiLibraries.ts
          git commit -m "fix: normalize resource card destinations"
          git push

      - name: Fail if broken links remain
        if: steps.audit.outcome == 'failure'
        run: exit 1
