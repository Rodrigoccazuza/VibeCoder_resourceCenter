name: Deploy resource center to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # GitHub Actions refreshes headlines daily; scheduled executions may be delayed.
  schedule:
    - cron: "23 11 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refresh AI news from publisher RSS feeds
        run: python3 scripts/update-ai-news.py

      - name: Persist latest news for the next deploy
        run: |
          git add public/ai-news.json
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "chore: refresh AI news digest"
            git push origin HEAD:main
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build static site
        run: npx next build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
