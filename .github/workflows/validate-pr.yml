name: Validate resource center pull requests

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Check news script syntax
        run: python3 -m py_compile scripts/update-ai-news.py
      - name: Install dependencies
        run: npm ci
      - name: Type-check site
        run: npx tsc --noEmit
      - name: Build static GitHub Pages site
        run: npx next build
